name: iOS-ipa-build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "stable"

      - name: Install CocoaPods
        run: sudo gem install cocoapods

      - name: Create Podfile if missing
        run: |
          cd ios
          if [ ! -f "Podfile" ]; then
            echo "platform :ios, '13.0'" > Podfile
            echo "target 'Runner' do" >> Podfile
            echo "  use_frameworks!" >> Podfile
            echo "  use_modular_headers!" >> Podfile
            echo "end" >> Podfile
          fi
          cd ..

      - name: Set iOS deployment target
        run: |
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [^;]*;/IPHONEOS_DEPLOYMENT_TARGET = 13.0;/g' ios/Runner.xcodeproj/project.pbxproj
          plutil -replace MinimumOSVersion -string "13.0" ios/Runner/Info.plist

      - name: Install dependencies
        run: |
          flutter pub get
          cd ios
          pod install --repo-update
          cd ..

      - name: Build IPA
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          mv Runner.app Payload/
          zip -qr app.ipa Payload

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: app.ipa
          path: build/ios/iphoneos/app.ipa
